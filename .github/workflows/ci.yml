name: FinMesh CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Debug repository layout
        run: |
          pwd
          ls -la
          ls -la finmesh

      - name: Install dependencies
        working-directory: ./finmesh
        run: uv sync

      - name: Validate Python imports
        working-directory: ./finmesh
        run: |
          uv run python -c "import shared.config"
          uv run python -c "import core.validator_service.main"
          uv run python -c "import networks.bank_producer.main"

      - name: Validate Docker Compose
        working-directory: ./finmesh
        run: docker compose config

      - name: Compile Python sources
        working-directory: ./finmesh
        run: uv run python -m compileall core networks shared airflow/dags
