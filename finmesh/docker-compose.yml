services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: finmesh-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"

  redpanda-console:
    image: redpandadata/console:latest
    container_name: finmesh-console
    depends_on:
      - redpanda
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092

  postgres:
    image: postgres:16
    container_name: finmesh-postgres
    environment:
      POSTGRES_USER: finmesh
      POSTGRES_PASSWORD: finmesh
      POSTGRES_DB: finmesh
    ports:
      - "5433:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: finmesh-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: finmesh-kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: finmesh-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: finmesh
      CLICKHOUSE_USER: finmesh
      CLICKHOUSE_PASSWORD: finmesh
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/clickhouse_init.sql:/docker-entrypoint-initdb.d/clickhouse_init.sql:ro

  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: kafka.Dockerfile
    container_name: finmesh-flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        rest.address: 0.0.0.0
        parallelism.default: 1

  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: kafka.Dockerfile
    container_name: finmesh-flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1

  flink-sql-client:
    build:
      context: ./flink
      dockerfile: kafka.Dockerfile
    container_name: finmesh-flink-sql-client
    command: bin/sql-client.sh
    depends_on:
      - flink-jobmanager
      - redpanda
    volumes:
      - ./flink/sql:/opt/flink/sql:ro
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
    profiles:
      - tools

  grafana:
    image: grafana/grafana:12.4.0
    container_name: finmesh-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - clickhouse

  airflow-postgres:
    image: postgres:16
    container_name: finmesh-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: finmesh-airflow-init
    depends_on:
      - airflow-postgres
      - postgres
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      PYTHONPATH: /opt/finmesh

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: finmesh
      POSTGRES_USER: finmesh
      POSTGRES_PASSWORD: finmesh

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/finmesh

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Fin
      --lastname Mesh
      --role Admin
      --email admin@finmesh.local
      "

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: finmesh-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    ports:
      - "8082:8080"

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      PYTHONPATH: /opt/finmesh

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: finmesh
      POSTGRES_USER: finmesh
      POSTGRES_PASSWORD: finmesh

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/finmesh

    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: finmesh-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      PYTHONPATH: /opt/finmesh

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: finmesh
      POSTGRES_USER: finmesh
      POSTGRES_PASSWORD: finmesh

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/finmesh

    command: scheduler

volumes:
  clickhouse_data:
  grafana_data:
  airflow_postgres_data: