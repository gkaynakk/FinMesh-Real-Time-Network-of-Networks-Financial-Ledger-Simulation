[project]
name = "finmesh"
version = "0.1.0"
description = "Real-time network-of-networks financial ledger simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=1.3.0",
    "confluent-kafka>=2.14.2",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]